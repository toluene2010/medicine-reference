name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: mkdir -p www/vendor && cp node_modules/pako/dist/pako_inflate.min.js www/vendor/pako_inflate.min.js
      - run: npx cap add android
      - run: npx cap sync android
      - name: Explicitly copy web assets into Android app
        run: |
          mkdir -p android/app/src/main/assets/public/data
          mkdir -p android/app/src/main/assets/public/vendor
          cp -f www/data/medicines.json.gz android/app/src/main/assets/public/data/medicines.json.gz
          cp -f www/vendor/pako_inflate.min.js android/app/src/main/assets/public/vendor/pako_inflate.min.js
      - name: Verify Android database asset before APK compilation
        run: |
          test -s www/data/medicines.json.gz
          test -s android/app/src/main/assets/public/data/medicines.json.gz
          cmp www/data/medicines.json.gz android/app/src/main/assets/public/data/medicines.json.gz
          gzip -t android/app/src/main/assets/public/data/medicines.json.gz
          ls -lh android/app/src/main/assets/public/data/medicines.json.gz
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: medicine-reference-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
