
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Install Pako browser library
        run: |
          mkdir -p www/vendor
          cp node_modules/pako/dist/pako_inflate.min.js www/vendor/pako_inflate.min.js

      - name: Prepare Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Copy medicine database into Android assets
        run: |
          mkdir -p android/app/src/main/assets/public/data
          mkdir -p android/app/src/main/assets/public/vendor
          cp -f www/data/medicines.json.gz android/app/src/main/assets/public/data/medicines.json.gz
          cp -f www/vendor/pako_inflate.min.js android/app/src/main/assets/public/vendor/pako_inflate.min.js

      - name: Verify Android database assets
        run: |
          test -s www/data/medicines.json.gz
          test -s android/app/src/main/assets/public/data/medicines.json.gz
          cmp www/data/medicines.json.gz android/app/src/main/assets/public/data/medicines.json.gz
          gzip -t android/app/src/main/assets/public/data/medicines.json.gz
          ls -lh android/app/src/main/assets/public/data/medicines.json.gz

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Install unzip utility
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Verify database inside final APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          echo "Checking final APK contents..."
          unzip -l "$APK"
          unzip -Z1 "$APK" | grep 'medicines.json.gz'
          unzip -Z1 "$APK" | grep 'pako_inflate.min.js'

      - uses: actions/upload-artifact@v4
        with:
          name: medicine-reference-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
